<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0B1220">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Workout">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>💪 Il mio Allenamento</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <h1>💪 Il mio Allenamento</h1>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="programma" onclick="switchTab('programma')">🗓 Programma</button>
        <button class="nav-tab" data-tab="esercizi" onclick="switchTab('esercizi')">📖 Esercizi</button>
        <button class="nav-tab" data-tab="statistiche" onclick="switchTab('statistiche')">📊 Statistiche</button>
    </div>

    <div id="programma-section">
        <div class="days-container" id="days-container">
            <!-- Bottoni generati dinamicamente via JS -->
        </div>

        <div id="steps-section">
            <h3>🦶 Passi del giorno</h3>
            <div class="steps-input-row">
                <input type="number" id="steps-input" placeholder="Inserisci i passi..." min="0" max="99999" inputmode="numeric">
                <button id="steps-save-btn" onclick="saveSteps()">✓</button>
            </div>
            <div id="steps-display" style="display:none;">
                <span id="steps-value">0</span> passi
                <button id="steps-edit-btn" onclick="editSteps()">✏️</button>
            </div>
            <p id="steps-future-msg" style="display:none; color:#8b949e; margin:10px 0 0 0; font-size:0.9rem;">I giorni futuri non accettano passi.</p>
        </div>

        <div id="workout-container" style="display:none;">
            <div id="day-header">
                <h2 id="day-title"></h2>
                <p id="day-subtitle"></p>
            </div>
            <div id="exercises-list"></div>
        </div>
    </div>

    <div id="esercizi-section" style="display:none;">
        <div id="db-filter-container">
            <button class="db-filter-btn active" data-filter="tutti" onclick="filterExercises('tutti')">Tutti</button>
            <button class="db-filter-btn" data-filter="Petto" onclick="filterExercises('Petto')">Petto</button>
            <button class="db-filter-btn" data-filter="Bicipiti" onclick="filterExercises('Bicipiti')">Bicipiti</button>
            <button class="db-filter-btn" data-filter="Tricipiti" onclick="filterExercises('Tricipiti')">Tricipiti</button>
            <button class="db-filter-btn" data-filter="Spalle" onclick="filterExercises('Spalle')">Spalle</button>
            <button class="db-filter-btn" data-filter="Dorso" onclick="filterExercises('Dorso')">Dorso</button>
            <button class="db-filter-btn" data-filter="Core" onclick="filterExercises('Core')">Core</button>
            <button class="db-filter-btn" data-filter="Gambe e Glutei" onclick="filterExercises('Gambe e Glutei')">Gambe e Glutei</button>
        </div>
        <p id="db-count" style="font-size: 0.8rem; color: #8b949e; margin-bottom: 12px;"></p>
        <div id="db-exercises-list"></div>
    </div>

    <div id="statistiche-section" style="display:none;">
        <div class="stats-period-tabs">
            <button class="stats-tab active" data-period="settimana" onclick="switchStatsPeriod('settimana')">Ultimi 7 giorni</button>
            <button class="stats-tab" data-period="mese" onclick="switchStatsPeriod('mese')">Ultimi 30 giorni</button>
        </div>
        <div id="stats-adherence"></div>
        <div id="stats-summary" class="stats-summary-row"></div>
        <canvas id="stats-chart" width="440" height="260"></canvas>
        <div id="stats-period-workouts" class="period-workouts-container"></div>

        <div style="margin-top: 24px; display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; gap: 10px;">
                <button onclick="exportData()" style="flex:1; background:var(--accent-orange-gradient); color:#0B1220; border:none; border-radius:10px; padding:14px; font-size:0.9rem; font-weight:800; cursor:pointer; min-height:48px; box-shadow:var(--glow-orange);">📥 Esporta Dati</button>
                <label style="flex:1; background:var(--surface-raised); color:var(--text-primary); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:0.9rem; font-weight:700; cursor:pointer; text-align:center; min-height:48px; display:flex; align-items:center; justify-content:center;">
                    📤 Importa Dati
                    <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
                </label>
            </div>
            <button type="button" onclick="showBackupList()" style="width:100%; background:var(--surface-raised); color:var(--text-primary); border:1px solid var(--border); border-radius:10px; padding:14px; font-size:0.9rem; font-weight:700; cursor:pointer; min-height:48px;">🔄 Ripristina Backup</button>
            <div id="backup-list-container" style="display:none; background:var(--surface-blue); border:1px solid var(--border); border-radius:10px; padding:12px;"></div>
        </div>
        <p id="data-status" style="font-size:0.8rem; color:var(--text-secondary); margin-top:8px; text-align:center;"></p>
    </div>

    <script src="js/app.js"></script>
    <div id="pwa-update-banner" role="alert">
        <span class="update-text">🔄 Nuova versione disponibile</span>
        <button type="button" class="update-btn">Tocca per aggiornare</button>
    </div>
</body>
</html>

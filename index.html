<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
    <title>💪 Il mio Allenamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 32px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #e6edf3;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .nav-tab {
            flex: 1;
            background-color: #21262d;
            color: #c9d1d9;
            border: none;
            padding: 14px 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 48px;
        }

        .nav-tab.active {
            background-color: #58a6ff;
            color: #0d1117;
            font-weight: 700;
        }

        .nav-tab:active {
            transform: scale(0.97);
        }

        /* Programma */
        .days-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
        }

        .day-num { font-size: 0.7rem; font-weight: 700; }

        .day-btn.today::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #58a6ff;
        }

        .day-btn.today.active::after { background-color: #0d1117; }

        .day-btn:active {
            transform: scale(0.95);
        }

        .day-btn.active {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
            font-weight: 700;
        }

        .day-btn.rest {
            background-color: #161b22;
            color: #8b949e;
            border-color: #21262d;
            font-style: italic;
        }

        .day-btn.rest.active {
            background-color: #8b949e;
            color: #0d1117;
            border-color: #8b949e;
        }

        /* Sezione passi */
        #steps-section {
            background-color: #161b22;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        #steps-section h3 {
            margin: 0;
            font-size: 1rem;
            color: #e6edf3;
        }

        .steps-input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        #steps-input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 1.2rem;
            padding: 12px 16px;
            width: 100%;
            flex: 1;
            outline: none;
        }

        #steps-input:focus {
            border-color: #58a6ff;
        }

        #steps-save-btn {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            padding: 12px 16px;
            min-width: 48px;
            cursor: pointer;
        }

        #steps-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
            margin-top: 12px;
        }

        #steps-edit-btn {
            background-color: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 8px;
        }

        /* Intestazione Giorno */
        #day-header {
            margin-bottom: 16px;
        }

        #day-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e6edf3;
        }

        #day-subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Card Esercizio */
        .exercise-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 3px solid transparent;
            transition: border-color 0.2s ease;
        }

        .exercise-card.done {
            border-left-color: #238636;
        }

        .exercise-card-image {
            width: 100%;
            aspect-ratio: 2 / 1;
            background-color: #0d1117;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .exercise-card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .exercise-name {
            font-size: 1rem;
            font-weight: 700;
            color: #e6edf3;
        }

        .exercise-card.done .exercise-name {
            text-decoration: line-through;
            color: #8b949e;
        }

        .muscle-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Colori Badge */
        .badge-petto { background-color: #1f3a2e; color: #56d364; }
        .badge-bicipiti { background-color: #3b1f3a; color: #d2a8ff; }
        .badge-tricipiti { background-color: #3b2f1f; color: #f0b858; }
        .badge-spalle { background-color: #1f2d3b; color: #79c0ff; }
        .badge-dorso { background-color: #3b1f1f; color: #ff7b72; }
        .badge-core { background-color: #2b3a1f; color: #a5d66e; }
        .badge-gambe { background-color: #1f3a3a; color: #56d3c4; }
        .badge-glutei { background-color: #3b1f2e; color: #ff9ec4; }
        .badge-gambe\ e\ glutei { background-color: #1f3a3a; color: #56d3c4; }

        .exercise-sets {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-weight: 600;
        }

        .toggle-desc-btn {
            background-color: transparent;
            border: none;
            color: #58a6ff;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 6px 0;
            margin-top: 6px;
        }

        .exercise-desc {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #8b949e;
        }

        /* Bottone "fatto" — target tap grande */
        .done-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 14px;
            padding: 16px;
            min-height: 56px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .done-btn:active { transform: scale(0.98); }

        .done-btn .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #8b949e;
            color: transparent;
            font-size: 0.85rem;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .done-btn.done {
            background-color: #238636;
            color: #fff;
            border-color: #238636;
        }

        .done-btn.done .check {
            background-color: #fff;
            border-color: #fff;
            color: #238636;
        }

        /* Layout Riposo */
        .rest-day {
            text-align: center;
            padding: 40px 20px;
        }

        .rest-emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .rest-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 8px;
        }

        .rest-subtitle {
            font-size: 0.9rem;
            color: #8b949e;
        }

        /* Sezione Esercizi (Database) */
        #db-filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #db-filter-container::-webkit-scrollbar {
            display: none;
        }

        .db-filter-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            min-height: 36px;
            transition: all 0.2s ease;
        }

        .db-filter-btn.active {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .db-exercise-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .db-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .db-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .db-card-body {
            padding: 16px;
        }

        .db-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .db-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e6edf3;
        }

        .db-card-stats {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-weight: 600;
        }

        .db-toggle-desc-btn {
            background-color: transparent;
            border: none;
            color: #58a6ff;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 6px 0;
            margin-top: 6px;
        }

        .db-card-desc {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #8b949e;
        }

        /* Sezione Statistiche */
        .stats-period-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .stats-tab {
            flex: 1;
            background-color: #21262d;
            color: #c9d1d9;
            border: none;
            padding: 12px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
        }

        .stats-tab.active {
            background-color: #58a6ff;
            color: #0d1117;
        }

        /* Card aderenza */
        .adherence-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .adherence-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .adherence-label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .adherence-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .adherence-bar {
            width: 100%;
            height: 10px;
            background-color: #21262d;
            border-radius: 6px;
            overflow: hidden;
        }

        .adherence-fill {
            height: 100%;
            background-color: #238636;
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .stats-summary-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stats-card {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stats-card-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .stats-card-label {
            font-size: 0.7rem;
            color: #8b949e;
            margin-top: 4px;
        }

        #stats-chart {
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 440 / 260;
            background-color: #161b22;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .stats-empty {
            text-align: center;
            padding: 32px 16px;
            color: #8b949e;
        }

        .stats-empty-emoji {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h1>💪 Il mio Allenamento</h1>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="programma" onclick="switchTab('programma')">🗓 Programma</button>
        <button class="nav-tab" data-tab="esercizi" onclick="switchTab('esercizi')">📖 Esercizi</button>
        <button class="nav-tab" data-tab="statistiche" onclick="switchTab('statistiche')">📊 Statistiche</button>
    </div>

    <div id="programma-section">
        <div class="days-container" id="days-container">
            <!-- Bottoni generati dinamicamente via JS -->
        </div>

        <div id="steps-section">
            <h3>🦶 Passi del giorno</h3>
            <div class="steps-input-row">
                <input type="number" id="steps-input" placeholder="Inserisci i passi..." min="0" max="99999" inputmode="numeric">
                <button id="steps-save-btn" onclick="saveSteps()">✓</button>
            </div>
            <div id="steps-display" style="display:none;">
                <span id="steps-value">0</span> passi
                <button id="steps-edit-btn" onclick="editSteps()">✏️</button>
            </div>
        </div>

        <div id="workout-container" style="display:none;">
            <div id="day-header">
                <h2 id="day-title"></h2>
                <p id="day-subtitle"></p>
            </div>
            <div id="exercises-list"></div>
        </div>
    </div>

    <div id="esercizi-section" style="display:none;">
        <div id="db-filter-container">
            <button class="db-filter-btn active" data-filter="tutti" onclick="filterExercises('tutti')">Tutti</button>
            <button class="db-filter-btn" data-filter="Petto" onclick="filterExercises('Petto')">Petto</button>
            <button class="db-filter-btn" data-filter="Bicipiti" onclick="filterExercises('Bicipiti')">Bicipiti</button>
            <button class="db-filter-btn" data-filter="Tricipiti" onclick="filterExercises('Tricipiti')">Tricipiti</button>
            <button class="db-filter-btn" data-filter="Spalle" onclick="filterExercises('Spalle')">Spalle</button>
            <button class="db-filter-btn" data-filter="Dorso" onclick="filterExercises('Dorso')">Dorso</button>
            <button class="db-filter-btn" data-filter="Core" onclick="filterExercises('Core')">Core</button>
            <button class="db-filter-btn" data-filter="Gambe e Glutei" onclick="filterExercises('Gambe e Glutei')">Gambe e Glutei</button>
        </div>
        <p id="db-count" style="font-size: 0.8rem; color: #8b949e; margin-bottom: 12px;"></p>
        <div id="db-exercises-list"></div>
    </div>

    <div id="statistiche-section" style="display:none;">
        <div class="stats-period-tabs">
            <button class="stats-tab active" data-period="settimana" onclick="switchStatsPeriod('settimana')">Ultimi 7 giorni</button>
            <button class="stats-tab" data-period="mese" onclick="switchStatsPeriod('mese')">Ultimi 30 giorni</button>
        </div>
        <div id="stats-adherence"></div>
        <div id="stats-summary" class="stats-summary-row"></div>
        <canvas id="stats-chart" width="440" height="260"></canvas>

        <div style="margin-top: 24px; display: flex; gap: 10px;">
            <button onclick="exportData()" style="flex:1; background:#238636; color:white; border:none; border-radius:10px; padding:14px; font-size:0.9rem; font-weight:600; cursor:pointer; min-height:48px;">📥 Esporta Dati</button>
            <label style="flex:1; background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:10px; padding:14px; font-size:0.9rem; font-weight:600; cursor:pointer; text-align:center; min-height:48px; display:flex; align-items:center; justify-content:center;">
                📤 Importa Dati
                <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
            </label>
        </div>
        <p id="data-status" style="font-size:0.8rem; color:#8b949e; margin-top:8px; text-align:center;"></p>
    </div>


    <script>
        /* =========================================================
           DATABASE ESERCIZI (asset riusabile)
           ========================================================= */
        const EXERCISES = {
            // Petto
            "neutral_close_grip_dumbbell_press": { id: "neutral_close_grip_dumbbell_press", name: "Neutral Close-Grip Dumbbell Press", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Spingendo i manubri uniti con presa neutra verso l'alto, si stimola la parte interna del petto (inner chest)." },
            "incline_dumbbell_press": { id: "incline_dumbbell_press", name: "Incline Dumbbell Press", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Spingendo i manubri verso l'alto su una panca inclinata, si stimola la parte superiore del petto (upper chest)." },
            "standard_dumbbell_press": { id: "standard_dumbbell_press", name: "Standard Dumbbell Press", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Abbassando i manubri ai lati del petto su una panca piana e spingendoli verso l'alto, si stimola l'intero petto (chest overall)." },
            "dumbbell_fly": { id: "dumbbell_fly", name: "Dumbbell Fly", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Aprendo e chiudendo le braccia con un arco controllato su panca piana, si stimola il petto (inner chest)." },
            "dumbbell_pullover": { id: "dumbbell_pullover", name: "Dumbbell Pullover", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Portando il manubrio oltre la testa e risollevandolo con un arco teso, si stimolano il petto e il dorso (chest + lats)." },
            "reverse_grip_dumbbell_press": { id: "reverse_grip_dumbbell_press", name: "Reverse-Grip Dumbbell Press", muscleGroup: "Petto", sets: "3-4", reps: "12-15", description: "Afferrando i manubri con presa inversa e spingendoli verso l'alto, si stimola la parte superiore del petto (upper chest)." },
            // Bicipiti
            "bicep_curl": { id: "bicep_curl", name: "Dumbbell Bicep Curl", muscleGroup: "Bicipiti", sets: "3-4", reps: "12-15", description: "Flessione delle braccia in piedi o seduti sulla sedia, eseguendo una supinazione (rotazione del polso verso l'esterno) durante la fase di salita." },
            "hammer_curl": { id: "hammer_curl", name: "Dumbbell Hammer Curl", muscleGroup: "Bicipiti", sets: "3-4", reps: "12-15", description: "Curl a martello. Flessione delle braccia mantenendo i palmi delle mani sempre rivolti l'uno verso l'altro (presa neutra) durante tutto il movimento." },
            "alternating_curl": { id: "alternating_curl", name: "Alternating Dumbbell Curl", muscleGroup: "Bicipiti", sets: "3-4", reps: "12-15", description: "Curl classico eseguito alternando in modo fluido il braccio destro e il braccio sinistro a ogni ripetizione." },
            "cross_body_curl": { id: "cross_body_curl", name: "Cross Body Hammer Curl", muscleGroup: "Bicipiti", sets: "3-4", reps: "12-15", description: "In piedi, afferra i manubri con presa neutra. Fletti un braccio portando il manubrio verso la spalla opposta, incrociando il petto. Ritorna lentamente alla posizione di partenza e alterna le braccia." },
            "incline_bicep_curl": { id: "incline_bicep_curl", name: "Incline Dumbbell Bicep Curl", muscleGroup: "Bicipiti", sets: "3-4", reps: "12-15", description: "Panca a 45-60°. Seduto, esegui il classico curl con manubri. La posizione del braccio dietro la linea del busto garantisce il massimo allungamento del capo lungo del bicipite." },
            // Tricipiti
            "1_triceps_Overhead_DB_Tricep_Extension": { id: "1_triceps_Overhead_DB_Tricep_Extension", name: "Triceps Overhead DB Extension", muscleGroup: "Tricipiti", sets: "3-4", reps: "12-15", description: "Estensioni dietro la nuca su panca. Seduto sulla panca con schienale verticale a 90° per stabilizzare la schiena, afferra il manubrio con entrambe le mani sopra la testa. Fletti i gomiti portando il peso dietro la nuca per il massimo allungamento, poi distendi le braccia verso l'alto contraendo i tricipiti." },
            "tricep_kickback": { id: "tricep_kickback", name: "Dumbbell Tricep Kickback", muscleGroup: "Tricipiti", sets: "3-4", reps: "12-15", description: "Busto flesso in avanti quasi parallelo al pavimento. Mantieni il braccio adeso al fianco e il gomito alto e immobile; estendi completamente l'avambraccio all'indietro." },
            "lying_triceps_extension": { id: "lying_triceps_extension", name: "Lying Dumbbell Triceps Extension", muscleGroup: "Tricipiti", sets: "3-4", reps: "12-15", description: "Su panca piana. Sdraiato, tieni i manubri con le braccia tese verso l'alto. Piega solo i gomiti portando i pesi ai lati della testa, poi distendi verso il soffitto." },
            // Spalle
            "seated_side_lateral_raise": { id: "seated_side_lateral_raise", name: "Seated Side Lateral Raise", muscleGroup: "Spalle", sets: "3-4", reps: "12-15", description: "Sedendosi su una panca per bloccare il busto e sollevando i manubri lateralmente, si stimola il lateral delts." },

        };

        /* =========================================================
           COSTANTI E UTILITY
           ========================================================= */
        const WEEKDAY_NAMES = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
        const MONTH_NAMES = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
        const ISO_TO_WEEKDAY = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
        const GROUPS = ["Tutti", "Petto", "Bicipiti", "Tricipiti", "Spalle", "Dorso", "Core", "Gambe e Glutei"];

        let selectedDate = '';

        function toISO(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        /* =========================================================
           STORAGE (localStorage centralizzato)
           Unica lettura: loadLog()/loadSteps(); unica scrittura:
           saveLog()/saveStepsData(). Se il JSON è corrotto la pagina
           non si rompe: il valore originale viene copiato in
           <chiave>_corrupt_<timestamp>, compare un messaggio leggibile
           e la lettura torna {} (l'utente può recuperare dal backup).
           ========================================================= */
        const _storageWarned = { wlog: false, steps_history: false };

        function warnStorageError(key, err) {
            console.error('[Storage] JSON corrotto in ' + key + ':', err);
            if (!_storageWarned[key]) {
                _storageWarned[key] = true;
                const status = document.getElementById('data-status');
                if (status) {
                    status.textContent = '⚠️ Dati locali (' + key + ') non leggibili: l\'originale è salvato in ' + key + '_corrupt_<data>. Esporta i dati che recuperi e reimportali.';
                    status.style.color = '#e3b341';
                }
            }
        }

        function loadLog() {
            const data = localStorage.getItem('wlog');
            if (!data) return {};
            try { return JSON.parse(data); }
            catch (err) {
                const ts = new Date().toISOString().replace(/[:.]/g, '-');
                try { localStorage.setItem('wlog_corrupt_' + ts, data); } catch (_) {}
                warnStorageError('wlog', err);
                return {};
            }
        }

        function saveLog(log) {
            localStorage.setItem('wlog', JSON.stringify(log));
        }

        function loadSteps() {
            const data = localStorage.getItem('steps_history');
            if (!data) return {};
            try { return JSON.parse(data); }
            catch (err) {
                const ts = new Date().toISOString().replace(/[:.]/g, '-');
                try { localStorage.setItem('steps_history_corrupt_' + ts, data); } catch (_) {}
                warnStorageError('steps_history', err);
                return {};
            }
        }

        function saveStepsData(history) {
            localStorage.setItem('steps_history', JSON.stringify(history));
        }

        /* =========================================================
           BACKUP LOCALE AUTOMATICO (wlog_backup)
           Snapshot {at, log, steps}: mantiene solo gli ultimi 3,
           con limite indicativo di ~500 KB totali (scarta dal più
           vecchio). Chiamato prima di ogni import e al massimo una
           volta al giorno all'avvio (marker wlog_backup_last_day).
           ========================================================= */
        const BACKUP_KEY = 'wlog_backup';
        const BACKUP_MAX = 3;
        const BACKUP_MAX_BYTES = 512 * 1024;

        function takeBackup() {
            try {
                const log = loadLog();
                const steps = loadSteps();
                if (Object.keys(log).length === 0 && Object.keys(steps).length === 0) return;
                let backups = [];
                const raw = localStorage.getItem(BACKUP_KEY);
                if (raw) { try { backups = JSON.parse(raw); } catch (_) { backups = []; } }
                if (!Array.isArray(backups)) backups = [];
                backups.push({ at: new Date().toISOString(), log: log, steps: steps });
                while (backups.length > BACKUP_MAX) backups.shift();
                while (backups.length > 1 && JSON.stringify(backups).length > BACKUP_MAX_BYTES) backups.shift();
                localStorage.setItem(BACKUP_KEY, JSON.stringify(backups));
            } catch (err) {
                console.error('[Backup] Errore durante lo snapshot:', err);
            }
        }

        function maybeDailyBackup() {
            const today = toISO(new Date());
            if (localStorage.getItem('wlog_backup_last_day') === today) return;
            try { takeBackup(); } catch (_) {}
            try { localStorage.setItem('wlog_backup_last_day', today); } catch (_) {}
        }

        /* [Punto d'aggancio Fase 4 — sincronizzazione reale]
           Gli stub scheduleCloudPush()/cloudPull() sono stati rimossi
           (non simulavano nulla e il polling fisso di 20s è eliminato).
           Qui andranno le funzioni di sync del provider scelto
           dall'utente: lettura al caricamento e al ritorno in
           foreground, niente setInterval. Finché non c'è, i dati
           restano solo su questo dispositivo (export/import JSON =
           piano di recupero). */

        /* =========================================================
           EXPORT / IMPORT DATI
           ========================================================= */
        function exportData() {
            const data = {
                version: 2,
                exported_at: new Date().toISOString(),
                workout_log: loadLog(),
                steps_history: loadSteps()
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `workout_backup_${toISO(new Date())}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            const status = document.getElementById('data-status');
            status.textContent = '✅ Dati esportati con successo!';
            status.style.color = '#56d364';
            setTimeout(() => { status.textContent = ''; }, 3000);
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = JSON.parse(e.target.result);

                    if (!data.workout_log && !data.steps_history) {
                        throw new Error('Formato non valido');
                    }

                    // Versione accettata: 2 (attuale) e 1 (storico); è ammessa anche
                    // l'assenza del campo. Versioni non intere o inferiori a 1: rifiuto.
                    if (data.version !== undefined && (!Number.isInteger(data.version) || data.version < 1)) {
                        throw new Error('Versione non supportata');
                    }

                    // Backup locale prima di ogni import (max 3 snapshot, ~500 KB totali)
                    takeBackup();

                    // Merge per data: le date diverse si uniscono sempre. Se la data è
                    // presente in entrambi e il contenuto differisce, si chiede una sola
                    // conferma riepilogativa (numero di date in conflitto) prima di
                    // sovrascrivere con i dati importati.
                    const currentLog = loadLog();
                    const currentSteps = loadSteps();

                    const conflicts = [];
                    for (const d of Object.keys(data.workout_log || {})) {
                        if (currentLog[d] !== undefined && JSON.stringify(currentLog[d]) !== JSON.stringify(data.workout_log[d])) conflicts.push(d);
                    }
                    for (const d of Object.keys(data.steps_history || {})) {
                        if (currentSteps[d] !== undefined && currentSteps[d] !== data.steps_history[d]) conflicts.push(d);
                    }
                    const uniqueConflicts = [...new Set(conflicts)];

                    let overwriteConflicts = true;
                    if (uniqueConflicts.length > 0) {
                        overwriteConflicts = confirm(`Attenzione: ${uniqueConflicts.length} data/e già presenti con contenuto diverso.\nI dati importati sovrascriveranno quelli locali per quelle date.\nContinuare?\n\n(${uniqueConflicts.join(', ')})`);
                    }

                    // Se confermato (o nessun conflitto): sovrascrive anche le date in conflitto.
                    // Se annullato (Decisione 4): lascia intatte le date in conflitto e unisce le date nuove.
                    const conflictSet = new Set(uniqueConflicts);
                    const mergedLog = { ...currentLog };
                    const mergedSteps = { ...currentSteps };
                    let newDatesCount = 0;

                    const importedDates = [...new Set([
                        ...Object.keys(data.workout_log || {}),
                        ...Object.keys(data.steps_history || {})
                    ])];

                    for (const d of importedDates) {
                        if (conflictSet.has(d) && !overwriteConflicts) {
                            continue;
                        }
                        if (currentLog[d] === undefined && currentSteps[d] === undefined) {
                            newDatesCount++;
                        }
                        if (data.workout_log && data.workout_log[d] !== undefined) {
                            mergedLog[d] = data.workout_log[d];
                        }
                        if (data.steps_history && data.steps_history[d] !== undefined) {
                            mergedSteps[d] = data.steps_history[d];
                        }
                    }

                    saveLog(mergedLog);
                    saveStepsData(mergedSteps);

                    if (uniqueConflicts.length > 0 && !overwriteConflicts) {
                        showImportStatus(`Import parziale: ${newDatesCount} date nuove unite, ${uniqueConflicts.length} date in conflitto lasciate invariate.`, '#e3b341');
                    } else {
                        showImportStatus('✅ Dati importati e uniti con successo!', '#56d364');
                    }

                    // Refresh UI
                    generateDays();
                    if (selectedDate) selectDate(selectedDate);
                } catch (err) {
                    showImportStatus('❌ Errore: file non valido.', '#ff7b72');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // reset per consentire reimportazione dello stesso file
        }

        function showImportStatus(text, color) {
            const status = document.getElementById('data-status');
            status.textContent = text;
            status.style.color = color;
            setTimeout(() => { status.textContent = ''; }, 3000);
        }

        /* =========================================================
           GIORNO DI RIPOSO
           ========================================================= */
        function toggleRestDay(iso) {
            const log = loadLog();
            if (!log[iso]) log[iso] = {};

            if (log[iso].is_rest) {
                delete log[iso].is_rest;
                if (Object.keys(log[iso]).length === 0) delete log[iso];
            } else {
                log[iso] = { is_rest: true };
            }

            saveLog(log);

            const btn = document.querySelector(`.day-btn[data-date="${iso}"]`);
            if (btn) {
                if (log[iso] && log[iso].is_rest) btn.classList.add('rest');
                else btn.classList.remove('rest');
            }

            selectDate(iso);
        }

        /* =========================================================
           CALENDARIO (generazione bottoni giorno)
           ========================================================= */
        function generateDays() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';
            const abbr = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
            const today = new Date();
            const todayISO = toISO(today);
            const log = loadLog();

            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const iso = toISO(d);
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.dataset.date = iso;
                if (iso === todayISO) btn.classList.add('today');

                if (log[iso] && log[iso].is_rest) btn.classList.add('rest');

                btn.innerHTML = `${abbr[d.getDay()]}<span class="day-num">${d.getDate()}</span>`;
                btn.onclick = () => selectDate(iso);
                container.appendChild(btn);
            }
        }

        /* =========================================================
           TAB NAVIGATION
           ========================================================= */
        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabName}"]`).classList.add('active');

            document.getElementById('programma-section').style.display = 'none';
            document.getElementById('esercizi-section').style.display = 'none';
            document.getElementById('statistiche-section').style.display = 'none';

            document.getElementById(`${tabName}-section`).style.display = 'block';

            if (tabName === 'esercizi') {
                renderExerciseDatabase('tutti');
            } else if (tabName === 'statistiche') {
                switchStatsPeriod('settimana');
            }
        }

        /* =========================================================
           TAB PROGRAMMA — selectDate + card esercizi
           ========================================================= */
        function selectDate(iso) {
            selectedDate = iso;
            refreshStepsSection(iso);
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.day-btn[data-date="${iso}"]`);
            if (btn) btn.classList.add('active');

            document.getElementById('workout-container').style.display = 'block';

            const d = new Date(iso + 'T12:00:00');
            document.getElementById('day-title').textContent =
                `${WEEKDAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;

            const list = document.getElementById('exercises-list');
            list.innerHTML = '';

            const log = loadLog();
            const dayLog = log[iso] || {};

            if (dayLog.is_rest) {
                document.getElementById('day-subtitle').textContent = '';
                list.innerHTML = `
                  <div class="rest-day" style="text-align: center;">
                    <div class="rest-emoji">😴</div>
                    <p class="rest-title">Giorno di Riposo</p>
                    <p class="rest-subtitle">Recupera le energie per la prossima sessione!</p>
                    <button class="db-filter-btn" style="margin-top:15px; border-color:#8b949e; color:#c9d1d9;" onclick="toggleRestDay('${iso}')">Annulla Riposo</button>
                  </div>`;
                return;
            }

            const doneCount = Object.keys(dayLog).filter(k => EXERCISES[k]).length;
            document.getElementById('day-subtitle').textContent = `${doneCount} esercizi completati in questa giornata`;

            let uiHTML = `
                <div style="text-align:center; margin-bottom:20px;">
                   <button class="db-filter-btn" style="background:#238636; color:white; border-color:#2ea043; padding: 10px 20px; font-weight: 600;" onclick="toggleRestDay('${iso}')">😴 Segna come Giorno di Riposo</button>
                </div>
                <div id="day-filter-container" style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:15px; padding-bottom:10px; border-bottom:1px solid #30363d;">
            `;

            GROUPS.forEach(g => {
                const isActive = g === 'Tutti' ? 'active' : '';
                uiHTML += `<button class="db-filter-btn day-group-btn ${isActive}" data-group="${g}" onclick="renderDayExercises('${iso}', '${g}')">${g}</button>`;
            });
            uiHTML += `</div><div id="day-exercises-container"></div>`;

            list.innerHTML = uiHTML;
            renderDayExercises(iso, 'Tutti');
        }

        function renderDayExercises(iso, groupFilter) {
            document.querySelectorAll('.day-group-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.group === groupFilter);
            });

            const container = document.getElementById('day-exercises-container');
            container.innerHTML = '';

            const log = loadLog();
            const dayLog = log[iso] || {};

            Object.values(EXERCISES).forEach(exercise => {
                if (groupFilter !== 'Tutti' && exercise.muscleGroup !== groupFilter) return;
                const isDone = !!dayLog[exercise.id];
                const card = buildWorkoutCard(exercise.id, iso, isDone);
                container.appendChild(card);
            });
        }

        function buildWorkoutCard(id, iso, done) {
            const exercise = EXERCISES[id];
            if (!exercise) return document.createElement('div');

            const badgeClass = `badge-${exercise.muscleGroup.toLowerCase()}`;
            let repsText = `${exercise.sets} serie × ${exercise.reps}`;
            if (!exercise.reps.includes('sec') && !exercise.reps.includes('per gamba')) {
                repsText += ' rip.';
            }

            const card = document.createElement('div');
            card.className = 'exercise-card' + (done ? ' done' : '');
            card.dataset.exerciseId = id;
            card.innerHTML = `
                <div class="exercise-card-image"><img src="immagini/${exercise.image || id + '.png'}" alt="${exercise.name}"></div>
                <div class="exercise-header">
                    <span class="exercise-name">${exercise.name}</span>
                    <span class="muscle-badge ${badgeClass}">${exercise.muscleGroup}</span>
                </div>
                <div class="exercise-sets">${repsText}</div>
                <button class="toggle-desc-btn" onclick="toggleDescription(this)">Mostra dettagli ▼</button>
                <div class="exercise-desc">${exercise.description}</div>
                <button class="done-btn${done ? ' done' : ''}" onclick="toggleDone('${id}')">
                    <span class="check">✓</span>
                    <span class="done-label">${done ? 'Fatto' : 'Segna come fatto'}</span>
                </button>`;
            return card;
        }

        function toggleDone(exerciseId) {
            const log = loadLog();
            if (!log[selectedDate]) log[selectedDate] = {};

            const nowDone = !log[selectedDate][exerciseId];
            if (nowDone) log[selectedDate][exerciseId] = true;
            else delete log[selectedDate][exerciseId];

            if (Object.keys(log[selectedDate]).length === 0) delete log[selectedDate];

            saveLog(log);

            const card = document.querySelector(`.exercise-card[data-exercise-id="${exerciseId}"]`);
            if (card) {
                card.classList.toggle('done', nowDone);
                const btn = card.querySelector('.done-btn');
                if (btn) {
                    btn.classList.toggle('done', nowDone);
                    const label = btn.querySelector('.done-label');
                    if (label) label.textContent = nowDone ? 'Fatto' : 'Segna come fatto';
                }
            }

            const dayLog = log[selectedDate] || {};
            const doneCount = Object.keys(dayLog).filter(k => EXERCISES[k]).length;
            document.getElementById('day-subtitle').textContent = `${doneCount} esercizi completati in questa giornata`;
        }

        function toggleDescription(btn) {
            const desc = btn.nextElementSibling;
            if (desc.style.display === 'none' || desc.style.display === '') {
                desc.style.display = 'block';
                btn.textContent = 'Nascondi dettagli ▲';
            } else {
                desc.style.display = 'none';
                btn.textContent = 'Mostra dettagli ▼';
            }
        }

        /* =========================================================
           PASSI
           ========================================================= */
        function saveSteps() {
            const input = document.getElementById('steps-input');
            const value = parseInt(input.value);
            if (isNaN(value) || value <= 0) return;

            document.querySelector('.steps-input-row').style.display = 'none';
            document.getElementById('steps-display').style.display = 'block';
            document.getElementById('steps-value').textContent = value.toLocaleString('it-IT');

            const history = loadSteps();
            history[selectedDate] = value;
            saveStepsData(history);
        }

        function refreshStepsSection(iso) {
            const history = loadSteps();
            const input = document.getElementById('steps-input');
            const inputRow = document.querySelector('.steps-input-row');
            const display = document.getElementById('steps-display');
            if (history[iso] != null && history[iso] > 0) {
                input.value = history[iso];
                inputRow.style.display = 'none';
                display.style.display = 'block';
                document.getElementById('steps-value').textContent = history[iso].toLocaleString('it-IT');
            } else {
                input.value = '';
                inputRow.style.display = 'flex';
                display.style.display = 'none';
            }
        }

        function editSteps() {
            document.getElementById('steps-display').style.display = 'none';
            document.querySelector('.steps-input-row').style.display = 'flex';
        }

        document.getElementById('steps-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveSteps();
        });

        /* =========================================================
           DATABASE ESERCIZI (tab consultazione)
           ========================================================= */
        function filterExercises(gruppo) {
            document.querySelectorAll('#db-filter-container .db-filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`#db-filter-container .db-filter-btn[data-filter="${gruppo}"]`).classList.add('active');
            renderExerciseDatabase(gruppo);
        }

        function renderExerciseDatabase(filtro) {
            const container = document.getElementById('db-exercises-list');
            container.innerHTML = '';

            const exerciseKeys = Object.keys(EXERCISES);
            let count = 0;

            exerciseKeys.forEach(key => {
                const exercise = EXERCISES[key];
                if (filtro && filtro !== 'tutti' && exercise.muscleGroup !== filtro) return;

                count++;
                const badgeClass = `badge-${exercise.muscleGroup.toLowerCase()}`;
                let repsText = `${exercise.sets} serie × ${exercise.reps}`;
                if (!exercise.reps.includes("sec") && !exercise.reps.includes("per gamba")) {
                    repsText += " rip.";
                }

                const card = document.createElement('div');
                card.className = 'db-exercise-card';
                card.innerHTML = `
                    <div class="db-card-image">
                        <img src="immagini/${exercise.image || exercise.id + '.png'}" alt="${exercise.name}">
                    </div>
                    <div class="db-card-body">
                        <div class="db-card-header">
                            <h3 class="db-card-title">${exercise.name}</h3>
                            <span class="muscle-badge ${badgeClass}">${exercise.muscleGroup}</span>
                        </div>
                        <div class="db-card-stats">${repsText}</div>
                        <button class="db-toggle-desc-btn" onclick="toggleDescription(this)">Mostra dettagli ▼</button>
                        <div class="db-card-desc">${exercise.description}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('db-count').textContent = `${count} esercizi trovati`;
        }

        /* =========================================================
           STATISTICHE (aderenza + passi)
           ========================================================= */
        function switchStatsPeriod(period) {
            document.querySelectorAll('.stats-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.stats-tab[data-period="${period}"]`).classList.add('active');

            const history = loadSteps();
            const log = loadLog();
            const days = period === 'settimana' ? 7 : 30;
            const dates = [];
            const today = new Date();

            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                dates.push(toISO(d));
            }

            const values = dates.map(d => history[d] || 0);
            const filledValues = values.filter(v => v > 0);
            const total = filledValues.reduce((a, b) => a + b, 0);
            const avg = filledValues.length > 0 ? Math.round(total / filledValues.length) : 0;

            // Aderenza libera: conteggio basato sui dati reali
            let trainedDays = 0, restDays = 0, totalExercisesDone = 0;
            dates.forEach(d => {
                const dayLog = log[d] || {};
                if (dayLog.is_rest) {
                    restDays++;
                } else {
                    const doneInDay = Object.keys(dayLog).filter(k => EXERCISES[k]).length;
                    if (doneInDay > 0) {
                        trainedDays++;
                        totalExercisesDone += doneInDay;
                    }
                }
            });

            const activeDays = trainedDays + restDays;
            const adherencePct = activeDays > 0 ? Math.round((trainedDays / activeDays) * 100) : 0;

            const adherenceHtml = activeDays > 0 ? `
                <div class="adherence-card">
                    <div class="adherence-header">
                        <span class="adherence-label">${period === 'settimana' ? 'Questa settimana' : 'Ultimi 30 giorni'}</span>
                        <span class="adherence-value">${trainedDays} allenamenti · ${restDays} riposi</span>
                    </div>
                    <div class="adherence-bar"><div class="adherence-fill" style="width:${adherencePct}%"></div></div>
                </div>
            ` : `
                <div class="stats-empty">
                    <div class="stats-empty-emoji">📊</div>
                    <p>Nessun dato registrato per questo periodo</p>
                </div>
            `;

            document.getElementById('stats-adherence').innerHTML = adherenceHtml;

            document.getElementById('stats-summary').innerHTML = `
                <div class="stats-card">
                    <div class="stats-card-value">${total.toLocaleString('it-IT')}</div>
                    <div class="stats-card-label">Totale passi</div>
                </div>
                <div class="stats-card">
                    <div class="stats-card-value">${avg.toLocaleString('it-IT')}</div>
                    <div class="stats-card-label">Media passi</div>
                </div>
                <div class="stats-card">
                    <div class="stats-card-value">${totalExercisesDone}</div>
                    <div class="stats-card-label">Esercizi fatti</div>
                </div>
            `;

            drawBarChart(dates, values, period);
        }

        function drawBarChart(dates, values, period) {
            const canvas = document.getElementById('stats-chart');
            const ctx = canvas.getContext('2d');

            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0) return;

            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const W = rect.width;
            const H = rect.height;
            const padding = { top: 20, right: 12, bottom: 40, left: 12 };
            const chartW = W - padding.left - padding.right;
            const chartH = H - padding.top - padding.bottom;

            ctx.clearRect(0, 0, W, H);

            const maxVal = Math.max(...values, 1000);
            const barCount = values.length;
            const barWidth = chartW / barCount * 0.7;
            const barGap = chartW / barCount * 0.3;

            values.forEach((val, i) => {
                const barH = (val / maxVal) * chartH;
                const x = padding.left + i * (chartW / barCount) + barGap / 2;
                const y = padding.top + chartH - barH;

                ctx.fillStyle = val > 0 ? '#58a6ff' : '#21262d';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, y, barWidth, barH, [4, 4, 0, 0]);
                } else {
                    ctx.rect(x, y, barWidth, barH);
                }
                ctx.fill();
            });

            ctx.fillStyle = '#8b949e';
            ctx.font = `${period === 'settimana' ? 11 : 8}px -apple-system, sans-serif`;
            ctx.textAlign = 'center';

            const dayAbbr = ['D', 'L', 'M', 'Me', 'G', 'V', 'S'];
            dates.forEach((date, i) => {
                const d = new Date(date + 'T12:00:00');
                const x = padding.left + i * (chartW / barCount) + (chartW / barCount) / 2;
                const label = period === 'settimana' ? dayAbbr[d.getDay()] : `${d.getDate()}`;
                ctx.fillText(label, x, H - padding.bottom + 16);
            });
        }

        /* =========================================================
           INIT
           ========================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            generateDays();
            selectDate(toISO(new Date()));

            // Backup automatico: al massimo una volta al giorno all'avvio
            maybeDailyBackup();

            // La sincronizzazione reale (Fase 4) leggherà all'avvio e al ritorno
            // in foreground; a questo punto non c'è polling né stub attivi.
        });
    </script>
</body>

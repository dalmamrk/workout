<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💪 Il mio Allenamento</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            font-size: 16px;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            padding: 16px;
            padding-bottom: 32px;
            max-width: 480px;
            margin: 0 auto;
        }

        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 20px;
            color: #e6edf3;
        }

        /* Nav Tabs */
        .nav-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 20px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .nav-tab {
            flex: 1;
            background-color: #21262d;
            color: #c9d1d9;
            border: none;
            padding: 14px 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            min-height: 48px;
        }

        .nav-tab.active {
            background-color: #58a6ff;
            color: #0d1117;
            font-weight: 700;
        }

        .nav-tab:active {
            transform: scale(0.97);
        }

        /* Programma */
        .days-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-bottom: 20px;
        }

        .day-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 12px 4px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: center;
            min-height: 48px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            position: relative;
        }

        .day-num { font-size: 0.7rem; font-weight: 700; }

        .day-btn.today::after {
            content: '';
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #58a6ff;
        }

        .day-btn.today.active::after { background-color: #0d1117; }

        .day-btn:active {
            transform: scale(0.95);
        }

        .day-btn.active {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
            font-weight: 700;
        }

        .day-btn.rest {
            background-color: #161b22;
            color: #8b949e;
            border-color: #21262d;
            font-style: italic;
        }

        .day-btn.rest.active {
            background-color: #8b949e;
            color: #0d1117;
            border-color: #8b949e;
        }

        /* Sezione passi */
        #steps-section {
            background-color: #161b22;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }

        #steps-section h3 {
            margin: 0;
            font-size: 1rem;
            color: #e6edf3;
        }

        .steps-input-row {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        #steps-input {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            color: #e6edf3;
            font-size: 1.2rem;
            padding: 12px 16px;
            width: 100%;
            flex: 1;
            outline: none;
        }

        #steps-input:focus {
            border-color: #58a6ff;
        }

        #steps-save-btn {
            background-color: #238636;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            padding: 12px 16px;
            min-width: 48px;
            cursor: pointer;
        }

        #steps-display {
            font-size: 1.5rem;
            font-weight: bold;
            color: #58a6ff;
            margin-top: 12px;
        }

        #steps-edit-btn {
            background-color: transparent;
            border: none;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 8px;
        }

        /* Intestazione Giorno */
        #day-header {
            margin-bottom: 16px;
        }

        #day-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e6edf3;
        }

        #day-subtitle {
            font-size: 0.85rem;
            color: #8b949e;
            margin-top: 4px;
        }

        /* Card Esercizio */
        .exercise-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
            border-left: 3px solid transparent;
            transition: border-color 0.2s ease;
        }

        .exercise-card.done {
            border-left-color: #238636;
        }

        .exercise-card-image {
            width: 100%;
            aspect-ratio: 2 / 1;
            background-color: #0d1117;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .exercise-card-image img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .exercise-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .exercise-name {
            font-size: 1rem;
            font-weight: 700;
            color: #e6edf3;
        }

        .exercise-card.done .exercise-name {
            text-decoration: line-through;
            color: #8b949e;
        }

        .muscle-badge {
            font-size: 0.65rem;
            font-weight: 600;
            padding: 3px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Colori Badge */
        .badge-petto { background-color: #1f3a2e; color: #56d364; }
        .badge-bicipiti { background-color: #3b1f3a; color: #d2a8ff; }
        .badge-tricipiti { background-color: #3b2f1f; color: #f0b858; }
        .badge-spalle { background-color: #1f2d3b; color: #79c0ff; }
        .badge-dorso { background-color: #3b1f1f; color: #ff7b72; }
        .badge-core { background-color: #2b3a1f; color: #a5d66e; }
        .badge-gambe { background-color: #1f3a3a; color: #56d3c4; }
        .badge-glutei { background-color: #3b1f2e; color: #ff9ec4; }

        .exercise-sets {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-weight: 600;
        }

        .toggle-desc-btn {
            background-color: transparent;
            border: none;
            color: #58a6ff;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 6px 0;
            margin-top: 6px;
        }

        .exercise-desc {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #8b949e;
        }

        /* Bottone "fatto" — target tap grande */
        .done-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            margin-top: 14px;
            padding: 16px;
            min-height: 56px;
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .done-btn:active { transform: scale(0.98); }

        .done-btn .check {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 2px solid #8b949e;
            color: transparent;
            font-size: 0.85rem;
            line-height: 1;
            transition: all 0.15s ease;
        }

        .done-btn.done {
            background-color: #238636;
            color: #fff;
            border-color: #238636;
        }

        .done-btn.done .check {
            background-color: #fff;
            border-color: #fff;
            color: #238636;
        }

        /* Layout Riposo */
        .rest-day {
            text-align: center;
            padding: 40px 20px;
        }

        .rest-emoji {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .rest-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #e6edf3;
            margin-bottom: 8px;
        }

        .rest-subtitle {
            font-size: 0.9rem;
            color: #8b949e;
        }

        /* Sezione Esercizi (Database) */
        #db-filter-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 12px;
            margin-bottom: 16px;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }

        #db-filter-container::-webkit-scrollbar {
            display: none;
        }

        .db-filter-btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            border-radius: 20px;
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            min-height: 36px;
            transition: all 0.2s ease;
        }

        .db-filter-btn.active {
            background-color: #58a6ff;
            color: #0d1117;
            border-color: #58a6ff;
        }

        .db-exercise-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 16px;
        }

        .db-card-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: #0d1117;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .db-card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .db-card-body {
            padding: 16px;
        }

        .db-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .db-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #e6edf3;
        }

        .db-card-stats {
            margin-top: 8px;
            font-size: 0.9rem;
            color: #58a6ff;
            font-weight: 600;
        }

        .db-toggle-desc-btn {
            background-color: transparent;
            border: none;
            color: #58a6ff;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 6px 0;
            margin-top: 6px;
        }

        .db-card-desc {
            display: none;
            margin-top: 10px;
            font-size: 0.85rem;
            line-height: 1.5;
            color: #8b949e;
        }

        /* Sezione Statistiche */
        .stats-period-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 16px;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #30363d;
        }

        .stats-tab {
            flex: 1;
            background-color: #21262d;
            color: #c9d1d9;
            border: none;
            padding: 12px 8px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            min-height: 44px;
        }

        .stats-tab.active {
            background-color: #58a6ff;
            color: #0d1117;
        }

        /* Card aderenza */
        .adherence-card {
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .adherence-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 10px;
        }

        .adherence-label {
            font-size: 0.85rem;
            color: #8b949e;
        }

        .adherence-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .adherence-bar {
            width: 100%;
            height: 10px;
            background-color: #21262d;
            border-radius: 6px;
            overflow: hidden;
        }

        .adherence-fill {
            height: 100%;
            background-color: #238636;
            border-radius: 6px;
            transition: width 0.3s ease;
        }

        .stats-summary-row {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .stats-card {
            flex: 1;
            background-color: #161b22;
            border: 1px solid #21262d;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
        }

        .stats-card-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: #58a6ff;
        }

        .stats-card-label {
            font-size: 0.7rem;
            color: #8b949e;
            margin-top: 4px;
        }

        #stats-chart {
            width: 100%;
            max-width: 100%;
            height: auto;
            aspect-ratio: 440 / 260;
            background-color: #161b22;
            border-radius: 10px;
            border: 1px solid #21262d;
        }

        .stats-empty {
            text-align: center;
            padding: 32px 16px;
            color: #8b949e;
        }

        .stats-empty-emoji {
            font-size: 2.5rem;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <h1>💪 Il mio Allenamento</h1>

    <div class="nav-tabs">
        <button class="nav-tab active" data-tab="programma" onclick="switchTab('programma')">🗓 Programma</button>
        <button class="nav-tab" data-tab="esercizi" onclick="switchTab('esercizi')">📖 Esercizi</button>
        <button class="nav-tab" data-tab="statistiche" onclick="switchTab('statistiche')">📊 Statistiche</button>
    </div>

    <div id="programma-section">
        <div class="days-container" id="days-container">
            <!-- Bottoni generati dinamicamente via JS -->
        </div>

        <div id="steps-section">
            <h3>🦶 Passi del giorno</h3>
            <div class="steps-input-row">
                <input type="number" id="steps-input" placeholder="Inserisci i passi..." min="0" max="99999" inputmode="numeric">
                <button id="steps-save-btn" onclick="saveSteps()">✓</button>
            </div>
            <div id="steps-display" style="display:none;">
                <span id="steps-value">0</span> passi
                <button id="steps-edit-btn" onclick="editSteps()">✏️</button>
            </div>
        </div>

        <div id="workout-container" style="display:none;">
            <div id="day-header">
                <h2 id="day-title"></h2>
                <p id="day-subtitle"></p>
            </div>
            <div id="exercises-list"></div>
        </div>
    </div>

    <div id="esercizi-section" style="display:none;">
        <div id="db-filter-container">
            <button class="db-filter-btn active" data-filter="tutti" onclick="filterExercises('tutti')">Tutti</button>
            <button class="db-filter-btn" data-filter="Petto" onclick="filterExercises('Petto')">Petto</button>
            <button class="db-filter-btn" data-filter="Bicipiti" onclick="filterExercises('Bicipiti')">Bicipiti</button>
            <button class="db-filter-btn" data-filter="Tricipiti" onclick="filterExercises('Tricipiti')">Tricipiti</button>
            <button class="db-filter-btn" data-filter="Spalle" onclick="filterExercises('Spalle')">Spalle</button>
            <button class="db-filter-btn" data-filter="Dorso" onclick="filterExercises('Dorso')">Dorso</button>
            <button class="db-filter-btn" data-filter="Core" onclick="filterExercises('Core')">Core</button>
            <button class="db-filter-btn" data-filter="Gambe" onclick="filterExercises('Gambe')">Gambe</button>
            <button class="db-filter-btn" data-filter="Glutei" onclick="filterExercises('Glutei')">Glutei</button>
        </div>
        <p id="db-count" style="font-size: 0.8rem; color: #8b949e; margin-bottom: 12px;"></p>
        <div id="db-exercises-list"></div>
    </div>

    <div id="statistiche-section" style="display:none;">
        <div class="stats-period-tabs">
            <button class="stats-tab active" data-period="settimana" onclick="switchStatsPeriod('settimana')">Ultimi 7 giorni</button>
            <button class="stats-tab" data-period="mese" onclick="switchStatsPeriod('mese')">Ultimi 30 giorni</button>
        </div>
        <div id="stats-adherence"></div>
        <div id="stats-summary" class="stats-summary-row"></div>
        <canvas id="stats-chart" width="440" height="260"></canvas>
    </div>

    <script>
        /* =========================================================
           DATABASE ESERCIZI (asset riusabile)
           ========================================================= */
        const EXERCISES = {
            // Petto
            "floor_press": { id: "floor_press", name: "Dumbbell Floor Press", muscleGroup: "Petto", sets: 4, reps: "10-12", description: "Disteso sulla schiena sul tappetino, spingi i manubri verso l'alto estendendo le braccia. I tricipiti toccano terra a ogni ripetizione in modo controllato." },
            "floor_flyes": { id: "floor_flyes", name: "Dumbbell Floor Flyes", muscleGroup: "Petto", sets: 3, reps: "12-15", description: "Croci a terra. Disteso supino sul tappetino, braccia leggermente piegate, apri i manubri lateralmente descrivendo un ampio arco finché i gomiti e i tricipiti sfiorano il terreno." },
            "push_ups": { id: "push_ups", name: "Push-ups", muscleGroup: "Petto", sets: 3, reps: "15-20", description: "Classici piegamenti sulle braccia eseguiti sul tappetino. Mantieni il core compatto, il corpo allineato dalle spalle ai piedi e scendi portando il petto vicino al pavimento." },
            "decline_push_ups": { id: "decline_push_ups", name: "Decline Push-ups", muscleGroup: "Petto", sets: 3, reps: "10-15", description: "Piegamenti sulle braccia con i piedi sollevati e appoggiati sulla sedia, mani a terra sul tappetino. Focus sulla parte alta del petto (deltoide anteriore e clavicolare)." },
            "incline_push_ups": { id: "incline_push_ups", name: "Incline Push-ups", muscleGroup: "Petto", sets: 3, reps: "15-20", description: "Piegamenti sulle braccia con le mani appoggiate sul bordo della sedia e i piedi a terra sul tappetino. Variante più leggera con focus sulla parte inferiore del petto." },
            // Bicipiti
            "bicep_curl": { id: "bicep_curl", name: "Dumbbell Bicep Curl", muscleGroup: "Bicipiti", sets: 3, reps: "10-12", description: "Flessione delle braccia in piedi o seduti sulla sedia, eseguendo una supinazione (rotazione del polso verso l'esterno) durante la fase di salita." },
            "hammer_curl": { id: "hammer_curl", name: "Dumbbell Hammer Curl", muscleGroup: "Bicipiti", sets: 3, reps: "10-12", description: "Curl a martello. Flessione delle braccia mantenendo i palmi delle mani sempre rivolti l'uno verso l'altro (presa neutra) durante tutto il movimento." },
            "concentration_curl": { id: "concentration_curl", name: "Seated Concentration Curl", muscleGroup: "Bicipiti", sets: 3, reps: "10-12", description: "Seduto sulla sedia con il busto flesso in avanti. Appoggia il gomito all'interno della coscia per bloccarlo e isolare completamente il bicipite durante la contrazione." },
            "alternating_curl": { id: "alternating_curl", name: "Alternating Dumbbell Curl", muscleGroup: "Bicipiti", sets: 3, reps: "10-12", description: "Curl classico eseguito alternando in modo fluido il braccio destro e il braccio sinistro a ogni ripetizione." },
            "cross_body_curl": { id: "cross_body_curl", name: "Cross Body Hammer Curl", muscleGroup: "Bicipiti", sets: 3, reps: "10-12", description: "In piedi, afferra i manubri con presa neutra. Fletti un braccio portando il manubrio verso la spalla opposta, incrociando il petto. Ritorna lentamente alla posizione di partenza e alterna le braccia." },
            // Tricipiti
            "chair_dips": { id: "chair_dips", name: "Chair Dips", muscleGroup: "Tricipiti", sets: 3, reps: "10-15", description: "Mani appoggiate sul bordo della sedia, bacino molto vicino alla struttura, gambe distese o piegate a terra. Scendi flettendo i gomiti fino a circa 90° e spingi verso l'alto." },
            "overhead_extension": { id: "overhead_extension", name: "Dumbbell Overhead Triceps Extension", muscleGroup: "Tricipiti", sets: 3, reps: "10-12", description: "Estensioni dietro la nuca. Seduto sulla sedia o in piedi, afferra un manubrio sopra la testa. Fletti i gomiti per far scendere il peso dietro la nuca, poi distendi di nuovo verso l'alto." },
            "tricep_kickback": { id: "tricep_kickback", name: "Dumbbell Tricep Kickback", muscleGroup: "Tricipiti", sets: 3, reps: "10-12", description: "Busto flesso in avanti quasi parallelo al pavimento. Mantieni il braccio adeso al fianco e il gomito alto e immobile; estendi completamente l'avambraccio all'indietro." },
            "skullcrusher": { id: "skullcrusher", name: "Lying Triceps Extension (Skullcrusher)", muscleGroup: "Tricipiti", sets: 3, reps: "10-12", description: "Disteso supino sul tappetino, braccia verticali perpendicolari al corpo. Fletti solo gli avambracci portando i manubri ai lati della testa, poi estendi nuovamente isolando i tricipiti." },
            // Spalle
            "overhead_press": { id: "overhead_press", name: "Seated Dumbbell Overhead Press", muscleGroup: "Spalle", sets: 4, reps: "8-10", description: "Spinte verticali. Seduto sulla sedia con la schiena ben dritta, spingi i manubri verso l'alto partendo dall'altezza delle spalle fino a distendere le braccia." },
            "lateral_raises": { id: "lateral_raises", name: "Dumbbell Lateral Raises", muscleGroup: "Spalle", sets: 3, reps: "12-15", description: "Alzate laterali. In piedi, solleva i manubri lateralmente fino all'altezza delle spalle, mantenendo una leggera flessione del gomito e i mignoli leggermente ruotati verso l'alto." },
            "front_raises": { id: "front_raises", name: "Dumbbell Front Raises", muscleGroup: "Spalle", sets: 3, reps: "10-12", description: "Alzate frontali. In piedi, solleva i manubri tesi in avanti alternandoli o contemporaneamente, fino all'altezza degli occhi." },
            "rear_delt_flyes": { id: "rear_delt_flyes", name: "Bent-Over Rear Delt Flyes", muscleGroup: "Spalle", sets: 3, reps: "12-15", description: "Aperture posteriori. Busto flesso in avanti a circa 45 gradi, solleva i manubri lateralmente spingendo indietro i gomiti per allenare i deltoidi posteriori." },
            // Dorso

        };

        /* =========================================================
           PROGRAMMA SETTIMANALE (template ricorrente)
           Chiavi = abbreviazioni giorno italiane. null = riposo.
           FACILMENTE EDITABILE: cambia gli id qui sotto per
           modificare il programma. L'architettura non cambia.
           ========================================================= */
        const WEEK_PLAN = {
            "Lun": ["floor_press", "push_ups", "decline_push_ups", "one_arm_row", "bent_over_row", "superman", "crunches", "plank"],          // Petto + Dorso + Core
            "Mar": ["overhead_press", "lateral_raises", "rear_delt_flyes", "bicep_curl", "hammer_curl", "chair_dips", "overhead_extension"], // Spalle + Braccia
            "Mer": null,                                                                                                                       // RIPOSO
            "Gio": ["floor_flyes", "incline_push_ups", "bulgarian_split_squat", "goblet_squat", "glute_bridge", "sumo_squat", "russian_twists", "leg_raises"], // Petto + Gambe + Glutei + Core
            "Ven": ["pullover", "one_arm_row", "concentration_curl", "alternating_curl", "cross_body_curl", "tricep_kickback", "skullcrusher"], // Dorso + Braccia
            "Sab": ["front_raises", "overhead_press", "chair_step_ups", "frog_glute_bridge", "plank", "leg_raises"],                            // Spalle + Gambe + Glutei + Core
            "Dom": null                                                                                                                        // RIPOSO
        };

        // Mappa data ISO → chiave WEEK_PLAN (0=Domenica come getDay)
        const ISO_TO_WEEKDAY = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];

        let selectedDate = '';

        /* =========================================================
           SINCRONIZZAZIONE CLOUD (Supabase) — riutilizzata
           localStorage resta la cache locale (l'app funziona offline);
           Supabase è lo strato di sync tra dispositivi.
           Codice di sync FISSO: tutti i dispositivi che aprono questa
           URL condividono gli stessi dati, senza alcuna azione utente.
           ========================================================= */
        const SB_URL = "https://rvckscsahnswceiajqve.supabase.co";
        const SB_KEY = "sb_publishable_5w1S1F7BX9yndp4vy0-vFw_s4h8jd0l";
        const SYNC_CODE = "workout-sync-8f3a7c21d9e4";
        const SB_HEADERS = {
            'apikey': SB_KEY,
            'Authorization': 'Bearer ' + SB_KEY,
            'Content-Type': 'application/json'
        };

        function localData() {
            return { steps_history: getStepsHistory(), wlog: getWorkoutLog() };
        }
        function applyData(d) {
            localStorage.setItem('steps_history', JSON.stringify(d.steps_history || {}));
            localStorage.setItem('wlog', JSON.stringify(d.wlog || {}));
        }
        // Unione non distruttiva: "over" vince sui conflitti, ma le chiavi disgiunte si conservano
        function mergeData(base, over) {
            base = base || {}; over = over || {};
            const wl = { ...(base.wlog || {}) };
            const oWl = over.wlog || {};
            for (const date in oWl) wl[date] = { ...(wl[date] || {}), ...oWl[date] };
            return {
                steps_history: { ...(base.steps_history || {}), ...(over.steps_history || {}) },
                wlog: wl
            };
        }

        async function cloudFetch() {
            const r = await fetch(`${SB_URL}/rest/v1/workout_sync?sync_code=eq.${SYNC_CODE}&select=data`, { headers: SB_HEADERS });
            if (!r.ok) throw new Error('GET ' + r.status);
            const rows = await r.json();
            return rows.length ? rows[0].data : { steps_history: {}, wlog: {} };
        }

        let cloudBusy = false, pushTimer = null;

        async function cloudPull() {
            // non disturbare l'editing in corso (input passi)
            if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
            try {
                const remote = await cloudFetch();
                const merged = mergeData(localData(), remote); // il remoto vince in pull
                applyData(merged);
                rerenderCurrent();
            } catch (e) { console.warn('cloudPull fallita (offline?):', e.message); }
        }

        async function cloudPush() {
            if (cloudBusy) return;
            cloudBusy = true;
            try {
                const remote = await cloudFetch();
                const merged = mergeData(remote, localData()); // il locale vince in push (appena modificato)
                applyData(merged);
                await fetch(`${SB_URL}/rest/v1/workout_sync`, {
                    method: 'POST',
                    headers: { ...SB_HEADERS, 'Prefer': 'resolution=merge-duplicates' },
                    body: JSON.stringify({ sync_code: SYNC_CODE, data: merged, updated_at: new Date().toISOString() })
                });
            } catch (e) { console.warn('cloudPush fallita (offline?):', e.message); }
            finally { cloudBusy = false; }
        }

        function scheduleCloudPush() {
            clearTimeout(pushTimer);
            pushTimer = setTimeout(cloudPush, 800); // coalescenza di salvataggi ravvicinati
        }

        // Re-render della vista corrente dopo un pull
        function rerenderCurrent() {
            if (document.getElementById('statistiche-section').style.display === 'block') {
                const period = (document.querySelector('.stats-tab.active') || {}).dataset?.period || 'settimana';
                switchStatsPeriod(period);
            } else if (selectedDate) {
                selectDate(selectedDate);
            }
        }

        // Data ISO YYYY-MM-DD in fuso LOCALE (NON usare toISOString che è UTC e può sfasare il giorno)
        function toISO(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        const WEEKDAY_NAMES = ['Domenica','Lunedì','Martedì','Mercoledì','Giovedì','Venerdì','Sabato'];
        const MONTH_NAMES = ['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];

        /* =========================================================
           PROGRAMMA: render bottoni settimana + vista giorno
           ========================================================= */
        function renderDayButtons() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';
            // Abbreviazioni indicizzate per getDay() (0=Dom ... 6=Sab)
            const abbr = ['DOM','LUN','MAR','MER','GIO','VEN','SAB'];
            const today = new Date();
            const todayISO = toISO(today);

            // Mostra OGGI + prossimi 6 giorni (anteprima delle prossime giornate).
            // Il primo bottone è sempre oggi; ieri e i giorni passati non sono mostrati.
            for (let i = 0; i < 7; i++) {
                const d = new Date(today);
                d.setDate(today.getDate() + i);
                const iso = toISO(d);
                const weekday = ISO_TO_WEEKDAY[d.getDay()];
                const btn = document.createElement('button');
                btn.className = 'day-btn';
                btn.dataset.date = iso;
                if (iso === todayISO) btn.classList.add('today');
                if (!WEEK_PLAN[weekday]) btn.classList.add('rest'); // giorno senza programma = riposo
                btn.innerHTML = `${abbr[d.getDay()]}<span class="day-num">${d.getDate()}</span>`;
                btn.onclick = () => selectDate(iso);
                container.appendChild(btn);
            }
        }

        // Navigazione tab
        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.nav-tab[data-tab="${tabName}"]`).classList.add('active');

            document.getElementById('programma-section').style.display = 'none';
            document.getElementById('esercizi-section').style.display = 'none';
            document.getElementById('statistiche-section').style.display = 'none';

            document.getElementById(`${tabName}-section`).style.display = 'block';

            if (tabName === 'esercizi') {
                renderExerciseDatabase('tutti');
            } else if (tabName === 'statistiche') {
                switchStatsPeriod('settimana');
            }
        }

        // Cuore del tab Programma
        function selectDate(iso) {
            selectedDate = iso;
            refreshStepsSection(iso);
            document.querySelectorAll('.day-btn').forEach(b => b.classList.remove('active'));
            const btn = document.querySelector(`.day-btn[data-date="${iso}"]`);
            if (btn) btn.classList.add('active');

            document.getElementById('workout-container').style.display = 'block';

            const d = new Date(iso + 'T12:00:00');
            const weekday = ISO_TO_WEEKDAY[d.getDay()];
            document.getElementById('day-title').textContent =
                `${WEEKDAY_NAMES[d.getDay()]} ${d.getDate()} ${MONTH_NAMES[d.getMonth()]}`;

            const list = document.getElementById('exercises-list');
            list.innerHTML = '';

            const dayExercises = WEEK_PLAN[weekday];
            if (!dayExercises || dayExercises.length === 0) {
                document.getElementById('day-subtitle').textContent = '';
                list.innerHTML = `
                  <div class="rest-day">
                    <div class="rest-emoji">😴</div>
                    <p class="rest-title">Giorno di Riposo</p>
                    <p class="rest-subtitle">Recupera le energie per la prossima sessione!</p>
                  </div>`;
                return;
            }

            const log = getWorkoutLog();
            const dayLog = log[iso] || {};

            // sottotitolo: gruppi muscolari del giorno + progresso spunte
            const groups = [...new Set(
                dayExercises.map(id => EXERCISES[id] && EXERCISES[id].muscleGroup).filter(Boolean)
            )];
            const doneCount = dayExercises.filter(id => dayLog[id]).length;
            document.getElementById('day-subtitle').textContent =
                `${groups.join(' + ')} · ${doneCount}/${dayExercises.length} completati`;

            dayExercises.forEach(id => {
                const card = buildWorkoutCard(id, iso, !!dayLog[id]);
                list.appendChild(card);
            });
        }

        // Card esercizio con checkbox "fatto"
        function buildWorkoutCard(id, iso, done) {
            const exercise = EXERCISES[id];
            if (!exercise) return document.createElement('div');

            const badgeClass = `badge-${exercise.muscleGroup.toLowerCase()}`;
            let repsText = `${exercise.sets} serie × ${exercise.reps}`;
            if (!exercise.reps.includes('sec') && !exercise.reps.includes('per gamba')) {
                repsText += ' rip.';
            }

            const card = document.createElement('div');
            card.className = 'exercise-card' + (done ? ' done' : '');
            card.dataset.exerciseId = id;
            card.innerHTML = `
                <div class="exercise-card-image"><img src="immagini/${id}.png" alt="${exercise.name}"></div>
                <div class="exercise-header">
                    <span class="exercise-name">${exercise.name}</span>
                    <span class="muscle-badge ${badgeClass}">${exercise.muscleGroup}</span>
                </div>
                <div class="exercise-sets">${repsText}</div>
                <button class="toggle-desc-btn" onclick="toggleDescription(this)">Mostra dettagli ▼</button>
                <div class="exercise-desc">${exercise.description}</div>
                <button class="done-btn${done ? ' done' : ''}" onclick="toggleDone('${id}')">
                    <span class="check">✓</span>
                    <span class="done-label">${done ? 'Fatto' : 'Segna come fatto'}</span>
                </button>`;
            return card;
        }

        // Toggle spunta esercizio: 1 tap = fatto/non fatto
        function toggleDone(exerciseId) {
            const log = getWorkoutLog();
            if (!log[selectedDate]) log[selectedDate] = {};

            const nowDone = !log[selectedDate][exerciseId];
            if (nowDone) log[selectedDate][exerciseId] = true;
            else delete log[selectedDate][exerciseId];

            // cleanup: se la data è vuota, rimuovi la chiave
            if (Object.keys(log[selectedDate]).length === 0) delete log[selectedDate];

            localStorage.setItem('wlog', JSON.stringify(log));
            scheduleCloudPush();

            // refresh visivo solo della card interessata + header (più rapido di un full re-render)
            const card = document.querySelector(`.exercise-card[data-exercise-id="${exerciseId}"]`);
            if (card) {
                card.classList.toggle('done', nowDone);
                const btn = card.querySelector('.done-btn');
                if (btn) {
                    btn.classList.toggle('done', nowDone);
                    const label = btn.querySelector('.done-label');
                    if (label) label.textContent = nowDone ? 'Fatto' : 'Segna come fatto';
                }
            }

            // aggiorna progresso nell'header
            const weekday = ISO_TO_WEEKDAY[new Date(selectedDate + 'T12:00:00').getDay()];
            const dayExercises = WEEK_PLAN[weekday] || [];
            const dayLog = log[selectedDate] || {};
            const groups = [...new Set(dayExercises.map(id => EXERCISES[id] && EXERCISES[id].muscleGroup).filter(Boolean))];
            const doneCount = dayExercises.filter(id => dayLog[id]).length;
            document.getElementById('day-subtitle').textContent =
                `${groups.join(' + ')} · ${doneCount}/${dayExercises.length} completati`;
        }

        // Toggle descrizione (unificato, usato sia da Programma che da DB)
        function toggleDescription(btn) {
            const desc = btn.nextElementSibling;
            if (desc.style.display === 'none' || desc.style.display === '') {
                desc.style.display = 'block';
                btn.textContent = 'Nascondi dettagli ▲';
            } else {
                desc.style.display = 'none';
                btn.textContent = 'Mostra dettagli ▼';
            }
        }

        /* =========================================================
           PASSI
           ========================================================= */
        function getStepsHistory() {
            const data = localStorage.getItem('steps_history');
            return data ? JSON.parse(data) : {};
        }

        function saveSteps() {
            const input = document.getElementById('steps-input');
            const value = parseInt(input.value);
            if (isNaN(value) || value <= 0) return;

            document.querySelector('.steps-input-row').style.display = 'none';
            document.getElementById('steps-display').style.display = 'block';
            document.getElementById('steps-value').textContent = value.toLocaleString('it-IT');

            // I passi sono salvati sul GIORNO SELEZIONATO (non sempre "oggi")
            const history = getStepsHistory();
            history[selectedDate] = value;
            localStorage.setItem('steps_history', JSON.stringify(history));
            scheduleCloudPush();
        }

        function refreshStepsSection(iso) {
            const history = getStepsHistory();
            const input = document.getElementById('steps-input');
            const inputRow = document.querySelector('.steps-input-row');
            const display = document.getElementById('steps-display');
            if (history[iso] != null && history[iso] > 0) {
                input.value = history[iso];
                inputRow.style.display = 'none';
                display.style.display = 'block';
                document.getElementById('steps-value').textContent = history[iso].toLocaleString('it-IT');
            } else {
                input.value = '';
                inputRow.style.display = 'flex';
                display.style.display = 'none';
            }
        }

        function editSteps() {
            document.getElementById('steps-display').style.display = 'none';
            document.querySelector('.steps-input-row').style.display = 'flex';
        }

        document.getElementById('steps-input').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') saveSteps();
        });

        /* =========================================================
           LOG ALLENAMENTO (spunte per-data)
           ========================================================= */
        function getWorkoutLog() {
            const data = localStorage.getItem('wlog');
            return data ? JSON.parse(data) : {};
        }

        /* =========================================================
           DATABASE ESERCIZI (tab consultazione)
           ========================================================= */
        function filterExercises(gruppo) {
            document.querySelectorAll('.db-filter-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`.db-filter-btn[data-filter="${gruppo}"]`).classList.add('active');
            renderExerciseDatabase(gruppo);
        }

        function renderExerciseDatabase(filtro) {
            const container = document.getElementById('db-exercises-list');
            container.innerHTML = '';

            const exerciseKeys = Object.keys(EXERCISES);
            let count = 0;

            exerciseKeys.forEach(key => {
                const exercise = EXERCISES[key];
                if (filtro && filtro !== 'tutti' && exercise.muscleGroup !== filtro) return;

                count++;
                const badgeClass = `badge-${exercise.muscleGroup.toLowerCase()}`;
                let repsText = `${exercise.sets} serie × ${exercise.reps}`;
                if (!exercise.reps.includes("sec") && !exercise.reps.includes("per gamba")) {
                    repsText += " rip.";
                }

                const card = document.createElement('div');
                card.className = 'db-exercise-card';
                card.innerHTML = `
                    <div class="db-card-image">
                        <img src="immagini/${exercise.id}.png" alt="${exercise.name}">
                    </div>
                    <div class="db-card-body">
                        <div class="db-card-header">
                            <h3 class="db-card-title">${exercise.name}</h3>
                            <span class="muscle-badge ${badgeClass}">${exercise.muscleGroup}</span>
                        </div>
                        <div class="db-card-stats">${repsText}</div>
                        <button class="db-toggle-desc-btn" onclick="toggleDescription(this)">Mostra dettagli ▼</button>
                        <div class="db-card-desc">${exercise.description}</div>
                    </div>
                `;
                container.appendChild(card);
            });

            document.getElementById('db-count').textContent = `${count} esercizi trovati`;
        }

        /* =========================================================
           STATISTICHE (aderenza + passi)
           ========================================================= */
        function switchStatsPeriod(period) {
            document.querySelectorAll('.stats-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.stats-tab[data-period="${period}"]`).classList.add('active');

            const history = getStepsHistory();
            const log = getWorkoutLog();
            const days = period === 'settimana' ? 7 : 30;
            const dates = [];
            const today = new Date();

            for (let i = days - 1; i >= 0; i--) {
                const d = new Date(today);
                d.setDate(d.getDate() - i);
                dates.push(toISO(d)); // data LOCALE, coerente con saveSteps/selectedDate
            }

            const values = dates.map(d => history[d] || 0);
            const filledValues = values.filter(v => v > 0);
            const total = filledValues.reduce((a, b) => a + b, 0);
            const avg = filledValues.length > 0 ? Math.round(total / filledValues.length) : 0;

            // Aderenza:allenamenti completati / giorni programmati nel periodo
            // Un giorno conta come "allenato" se ha almeno 1 spunta nel log
            let programmedDays = 0, trainedDays = 0, totalExercisesDone = 0;
            dates.forEach(d => {
                const dObj = new Date(d + 'T12:00:00');
                const weekday = ISO_TO_WEEKDAY[dObj.getDay()];
                const plan = WEEK_PLAN[weekday];
                if (plan && plan.length > 0) {
                    programmedDays++;
                    const dayLog = log[d] || {};
                    const doneInDay = plan.filter(id => dayLog[id]).length;
                    if (doneInDay > 0) trainedDays++;
                    totalExercisesDone += doneInDay;
                }
            });
            const adherencePct = programmedDays > 0 ? Math.round((trainedDays / programmedDays) * 100) : 0;

            // Card aderenza (solo se ci sono giorni programmati nel periodo)
            const adherenceHtml = programmedDays > 0 ? `
                <div class="adherence-card">
                    <div class="adherence-header">
                        <span class="adherence-label">${period === 'settimana' ? 'Questa settimana' : 'Ultimi 30 giorni'}</span>
                        <span class="adherence-value">${trainedDays}/${programmedDays} allenamenti</span>
                    </div>
                    <div class="adherence-bar"><div class="adherence-fill" style="width:${adherencePct}%"></div></div>
                </div>
            ` : '';

            document.getElementById('stats-adherence').innerHTML = adherenceHtml;

            document.getElementById('stats-summary').innerHTML = `
                <div class="stats-card">
                    <div class="stats-card-value">${total.toLocaleString('it-IT')}</div>
                    <div class="stats-card-label">Totale passi</div>
                </div>
                <div class="stats-card">
                    <div class="stats-card-value">${avg.toLocaleString('it-IT')}</div>
                    <div class="stats-card-label">Media passi</div>
                </div>
                <div class="stats-card">
                    <div class="stats-card-value">${totalExercisesDone}</div>
                    <div class="stats-card-label">Esercizi fatti</div>
                </div>
            `;

            drawBarChart(dates, values, period);
        }

        function drawBarChart(dates, values, period) {
            const canvas = document.getElementById('stats-chart');
            const ctx = canvas.getContext('2d');

            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0) return; // canvas non visibile

            canvas.width = rect.width * window.devicePixelRatio;
            canvas.height = rect.height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

            const W = rect.width;
            const H = rect.height;
            const padding = { top: 20, right: 12, bottom: 40, left: 12 };
            const chartW = W - padding.left - padding.right;
            const chartH = H - padding.top - padding.bottom;

            ctx.clearRect(0, 0, W, H);

            const maxVal = Math.max(...values, 1000);
            const barCount = values.length;
            const barWidth = chartW / barCount * 0.7;
            const barGap = chartW / barCount * 0.3;

            values.forEach((val, i) => {
                const barH = (val / maxVal) * chartH;
                const x = padding.left + i * (chartW / barCount) + barGap / 2;
                const y = padding.top + chartH - barH;

                ctx.fillStyle = val > 0 ? '#58a6ff' : '#21262d';
                ctx.beginPath();
                if (ctx.roundRect) {
                    ctx.roundRect(x, y, barWidth, barH, [4, 4, 0, 0]);
                } else {
                    ctx.rect(x, y, barWidth, barH);
                }
                ctx.fill();
            });

            ctx.fillStyle = '#8b949e';
            ctx.font = `${period === 'settimana' ? 11 : 8}px -apple-system, sans-serif`;
            ctx.textAlign = 'center';

            const dayAbbr = ['D', 'L', 'M', 'Me', 'G', 'V', 'S'];
            dates.forEach((date, i) => {
                const d = new Date(date + 'T12:00:00');
                const x = padding.left + i * (chartW / barCount) + (chartW / barCount) / 2;
                const label = period === 'settimana' ? dayAbbr[d.getDay()] : `${d.getDate()}`;
                ctx.fillText(label, x, H - padding.bottom + 16);
            });
        }

        /* =========================================================
           INIT
           ========================================================= */
        document.addEventListener('DOMContentLoaded', () => {
            renderDayButtons();
            selectDate(toISO(new Date())); // selectDate aggiorna anche la sezione passi del giorno

            // Sincronizzazione cloud: pull all'avvio + seed dei dati locali già presenti,
            // poi poll periodico e pull al rientro sull'app
            cloudPull().then(() => scheduleCloudPush());
            setInterval(cloudPull, 20000);
            document.addEventListener('visibilitychange', () => { if (!document.hidden) cloudPull(); });
        });
    </script>
</body>
